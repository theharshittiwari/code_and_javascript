<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>chai aur code</h1>
    <button id="stop">Stop</button>
    <button id="start">Start</button>
</body>
<script>
   
//    setInterval(function(){
//     console.log("Harshit")
//    },2000)

const sayharshit=function(){
    console.log("Harshit")
}
setInterval(sayharshit,2000)

const changeText= function(){document.querySelector('h1').innerHTML="best javascript series"}

// setInterval(changeText,2000)

let changeMe=setInterval(changeText,2000)

document.querySelector('#stop').addEventListener('click',function(){
    clearInterval(changeMe)
    console.log("STOOPED")
})

document.querySelector('#start').addEventListener('click',function(){
    changeMe=setInterval(changeText,2000)
    console.log('STARTED')
})






</script>
</html>
