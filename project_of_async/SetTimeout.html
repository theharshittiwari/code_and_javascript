<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // Method 1
    // setTimeout(function(){
    //     console.log("Harshit Tiwari")
    // },2000)

    // Method 2 by handler
      const sayharshit=function(){
        console.log("Harshit Tiwari")
    }

    setTimeout(sayharshit,2000)

    const changeText=function(){
        document.querySelector('h1').innerHTML="best js series"
    }

    // setTimeout(changeText,2000) ab esi ko ham variable me hold karene
       const changeMe= setTimeout(changeText,2000)
    //    clearTimeout(changeMe)  ab ye kane se Text nhi change ho raha hai but ham chahte hai ki yahi operation kisi event pe ho button dabane pe ho 

    document.querySelector('#stop').addEventListener('click',function(){
         clearTimeout(changeMe)
         console.log('STOPPED')
    })

</script>
</html>
